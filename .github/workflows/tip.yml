name: Tip

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$APPLE_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed s/\"//g)
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Test
        env:
          SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
        run: make test

      - name: Build and sign
        env:
          SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
        run: |
          make sign VERSION=tip
          codesign -vvv --deep --strict opcli.app

      - name: Create release archive
        run: |
          ARCH=$(uname -m)
          tar -czvf opcli-tip-darwin-${ARCH}.tar.gz opcli.app
          echo "ARCHIVE=opcli-tip-darwin-${ARCH}.tar.gz" >> $GITHUB_ENV

      # Recreate the release rather than updating it in place. GitHub shows a
      # release's original publish date, and has no way to move it, so a
      # release updated in place looks months old however fresh its build is.
      - name: Replace tip release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fails if there is no tip release yet. A real failure to delete
          # surfaces below, when the create finds the release still there.
          gh release delete tip --cleanup-tag --yes || true
          gh release create tip "$ARCHIVE" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "tip (latest main)" \
            --notes "Rolling build from the latest commit on \`main\`.

          Commit: $GITHUB_SHA"
